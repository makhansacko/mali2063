<svg width="1200" height="500" viewBox="0 0 1200 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>MALI2063 Logo</title>
  <desc>Two overlapping circles inspired by a card-network style mark, using Mali flag colors with an explicit yellow intersection.</desc>

  <rect width="1200" height="500" fill="white"/>

  <!-- Symbol -->
  <g transform="translate(0,10)">
    <circle cx="500" cy="190" r="110" fill="#14A44D"/>
    <circle cx="650" cy="190" r="110" fill="#D62828"/>
    <path d="M575 109.683C608.455 129.541 631 156.081 631 190C631 223.919 608.455 250.459 575 270.317C541.545 250.459 519 223.919 519 190C519 156.081 541.545 129.541 575 109.683Z" fill="#F2C300"/>

    <!-- Wordmark -->
    <text x="575" y="365" text-anchor="middle"
          font-family="Arial, Helvetica, sans-serif"
          font-size="64"
          font-weight="700"
          letter-spacing="1">
      <tspan fill="#111111">MALI</tspan><tspan fill="#F2C300">2063</tspan>
    </text>

    <text x="575" y="405" text-anchor="middle"
          font-family="Arial, Helvetica, sans-serif"
          font-size="24"
          font-weight="500"
          letter-spacing="3.5"
          fill="#5A5A5A">mali2063.org</text>
  </g>
</svg>
